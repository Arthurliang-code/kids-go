<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>萌宝少儿围棋 (Kids Go Master)</title>
  
  <!-- iPad / iOS 独立桌面 App 运行增强 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="萌宝围棋">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b81">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题与音效栏 -->
  <header class="top-header">
    <div class="logo-area">
      <span class="app-icon">🐼</span>
      <h1 class="app-title">萌宝少儿围棋</h1>
    </div>
    <div class="header-tools">
      <button class="install-pill-btn" id="btnInstallGuide" title="把围棋放到iPad桌面">📲 放到桌面</button>
      <button class="icon-btn" id="toggleVoice" title="自动语音朗读">🗣️</button>
      <button class="icon-btn" id="toggleSound" title="声音开关">🔊</button>
    </div>
  </header>

  <!-- 模式切换选项卡 -->
  <nav class="nav-tabs">
    <button class="tab-btn active" id="tabAcademy">
      <span>📖</span> 基础知识闯关
    </button>
    <button class="tab-btn" id="tabMatch">
      <span>⚔️</span> 萌宠段位对战
    </button>
    <button class="tab-btn" id="tabBadges">
      <span>🏅</span> 荣誉勋章
    </button>
  </nav>

  <main class="main-container">
    
    <!-- 1. 基础知识闯关：紧凑关卡选择与语音栏 -->
    <section class="view-section active" id="viewAcademy">
      <div class="level-selector-card">
        <div class="level-header-row">
          <span class="level-title-large">🌟 趣味知识闯关</span>
          <div class="voice-toolbar">
            <button class="voice-btn" id="btnSpeakInstruction">
              <span class="voice-icon">📢</span> <span id="voiceBtnText">听师傅读题</span>
            </button>
            <select id="selectVoicePack" class="voice-pack-select" title="切换配音老师">
              <option value="xiaoxiao" selected>🌟 晓晓老师 (温暖故事音)</option>
              <option value="xiaoyi">👧 晓伊姐姐 (甜美萌音)</option>
              <option value="yunxia">👦 云夏弟弟 (活泼童声)</option>
              <option value="yunxi">🐼 云希哥哥 (阳光导师)</option>
            </select>
          </div>
        </div>
        <!-- 教学阶段切换：启蒙初级 vs 进阶中级 -->
        <div class="stage-switcher" id="stageSwitcher">
          <button class="stage-pill active" id="btnStageBeginner">🌱 启蒙初级 (1~10关)</button>
          <button class="stage-pill" id="btnStageIntermediate">🔥 进阶中级 (11~20关)</button>
        </div>
        <div class="level-chips-scroll" id="levelChipsContainer">
          <!-- 动态生成 1~10 关卡胶囊 -->
        </div>
      </div>
    </section>

    <!-- 2. 我的勋章视图 -->
    <section class="view-section" id="viewBadges">
      <div class="level-selector-card">
        <div class="level-header-row">
          <span class="level-title-large">🏆 围棋小大师勋章馆</span>
        </div>
        <p style="font-size: 13px; color: #747d8c; margin-bottom: 12px;">完成知识闯关或在对弈中升级，即可点亮专属勋章！</p>
        <div class="badge-grid" id="badgeGrid">
          <!-- 动态生成勋章卡片 -->
        </div>
      </div>
    </section>

    <!-- 核心棋盘与操作区 -->
    <div class="game-layout" id="gameLayout">
      <div class="board-column">
        <!-- 二合一「🐼 熊猫导师互动讲堂卡」（集成闯关题目、原理图解切换与答案详解，告别双层重复文本框） -->
        <div class="pet-card" id="petCard">
          <div class="pet-avatar-wrapper">
            <div class="pet-avatar" id="petAvatar">🐼</div>
          </div>
          <div class="pet-info">
            <div class="pet-name-row">
              <div class="pet-title-group">
                <span class="pet-name" id="petName">熊猫师傅</span>
                <span class="rank-badge" id="petRank">第1关</span>
              </div>
              <!-- 即学即练：一键切换【动手闯关】与【原理图解1/2】 -->
              <div class="step-pills-bar" id="academyStepPills">
                <button class="step-pill active" id="btnTabPractice">🎯 动手闯关</button>
                <button class="step-pill" id="btnTabTeach1">📖 图解1</button>
                <button class="step-pill" id="btnTabTeach2">📖 图解2</button>
              </div>
            </div>
            <div class="pet-speech" id="petSpeech">你好呀！欢迎来到围棋世界，让我们开始第一课吧！</div>
            <!-- 答案解析与自动演示内嵌条（仅在点击“显示答案”时展开，不额外撑开独立弹窗） -->
            <div class="answer-reveal-box" id="answerRevealBox" style="display: none;">
              <div class="answer-reveal-content" id="answerRevealText"></div>
              <button class="btn-auto-solve" id="btnAutoPlayAnswer" title="让熊猫师傅在棋盘上自动走子演示">
                ✨ 自动走子演示
              </button>
            </div>
          </div>
        </div>

        <!-- 对弈回合大横幅（紧贴棋盘上方，一眼看清轮到谁下） -->
        <div class="turn-banner" id="turnBanner" style="display: none;">
          <span class="stone-pill turn-stone black" id="turnBannerStone"></span>
          <span id="turnBannerText">轮到你下黑棋啦！</span>
        </div>

        <!-- 棋盘容器 -->
        <div class="board-wrapper" id="boardWrapper">
          <canvas id="boardCanvas"></canvas>
          <!-- 触控悬浮放大准星（专为手指触控优化防遮挡） -->
          <div class="touch-loupe" id="touchLoupe"></div>
        </div>
      </div>

      <!-- 侧边面板：记分与功能控制 -->
      <div class="side-panel">
        <!-- 对弈双方阵营卡（执子归属 + 提子数 + 当前轮到谁，仅在对弈模式显示） -->
        <div class="score-box" id="scoreBox" style="display: none;">
          <div class="player-side" id="playerSideBlack">
            <span class="turn-flag">👉 轮到你</span>
            <span class="stone-pill big black"></span>
            <div class="side-info">
              <div class="side-name">🧒 我（执黑）</div>
              <div class="side-caps">提子 <b id="blackScore">0</b></div>
            </div>
          </div>
          <div class="vs-mark">VS</div>
          <div class="player-side" id="playerSideWhite">
            <span class="turn-flag">🤔 思考中</span>
            <span class="stone-pill big white"></span>
            <div class="side-info">
              <div class="side-name" id="opponentSideName">🐱 萌宠（执白）</div>
              <div class="side-caps">提子 <b id="whiteScore">0</b></div>
            </div>
          </div>
        </div>

        <!-- 闯关专用控制按钮（4个清爽大按钮，唯一入口不重复） -->
        <div id="academyControls">
          <div class="action-buttons">
            <button class="btn-fun btn-secondary" id="btnReplayTeach">
              <span>📖</span> <span id="btnTeachText">看原理图解</span>
            </button>
            <button class="btn-fun btn-primary" id="btnShowAnswer">
              <span>💡</span> <span id="btnShowAnswerText">显示答案</span>
            </button>
            <button class="btn-fun btn-accent" id="btnResetPuzzle">
              <span>🔄</span> 重新摆棋
            </button>
            <button class="btn-fun btn-green" id="btnNextPuzzle">
              <span>👉</span> 下一关
            </button>
          </div>
        </div>

        <!-- 对战专用控制按钮 -->
        <div id="matchControls" style="display: none; flex-direction: column; gap: 10px;">
          <div class="action-buttons">
            <button class="btn-fun btn-primary" id="btnUndo">
              <span>↩️</span> 悔棋一步
            </button>
            <button class="btn-fun btn-accent" id="btnRestart">
              <span>🔄</span> 重新开局
            </button>
            <button class="btn-fun btn-secondary" id="btnPass">
              <span>✋</span> 停一手(Pass)
            </button>
            <button class="btn-fun btn-green" id="btnHint">
              <span>💡</span> 熊猫支招
            </button>
          </div>

          <!-- 对局设置选项 -->
          <div class="toggle-row">
            <span>棋盘规格</span>
            <select id="selectBoardSize" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd; font-weight: 700; background: #fff;">
              <option value="9" selected>9路盘 (快速入门)</option>
              <option value="13">13路盘 (中盘实战)</option>
              <option value="19">19路盘 (标准大盘)</option>
            </select>
          </div>

          <div class="toggle-row">
            <span>对战玩法</span>
            <select id="selectGameMode" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd; font-weight: 700; background: #fff;">
              <option value="capture" data-target="3" selected>吃子棋 (先吃3子赢)</option>
              <option value="capture" data-target="5">吃子棋 (先吃5子赢)</option>
              <option value="territory">标准围地数子</option>
            </select>
          </div>
        </div>

        <!-- 少儿贴心辅助开关 -->
        <div class="toggle-row">
          <span>🟢 气数与危险预警提示</span>
          <label class="switch">
            <input type="checkbox" id="toggleLiberties">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </main>

  <!-- 胜利/晋级大捷弹窗 -->
  <div class="modal-overlay" id="victoryModal">
    <div class="modal-content">
      <div class="star-celebration">⭐ 🌟 ⭐</div>
      <h3 class="modal-title" id="modalTitle">闯关大成功！</h3>
      <p class="modal-desc" id="modalDesc">太棒了，你找到了正确的方法！</p>
      <button class="btn-fun btn-primary" id="btnModalAction" style="width: 100%; font-size: 18px; padding: 14px;">
        继续前进！
      </button>
    </div>
  </div>

  <!-- 专为异地长辈与小朋友设计的超大字「放到 iPad 桌面」图文傻瓜指引弹窗 -->
  <div class="modal-overlay" id="installGuideModal">
    <div class="modal-content install-guide-card">
      <div class="corner-pointer-badge">👆 请看屏幕右上角</div>
      <h3 class="modal-title" style="font-size: 24px; color: #ff4757; margin-bottom: 12px;">🐼 放到 iPad 桌面（超简单 2 步）</h3>
      <div id="installGuideSteps" class="install-steps-box">
        <!-- 根据微信或 Safari 自动切换超大字步骤 -->
      </div>
      <div style="background: #f1f2f6; border-radius: 14px; padding: 10px 14px; margin-bottom: 16px; font-size: 15px; color: #2f3542; font-weight: 700;">
        💡 温馨提示：哪怕不添加到桌面，现在也<strong>可以直接点棋盘开始玩</strong>哦！
      </div>
      <button class="btn-fun btn-green" id="btnCloseInstallGuide" style="width: 100%; font-size: 19px; padding: 14px;">
        我知道啦，开始下棋！
      </button>
    </div>
  </div>

  <!-- 模块化脚本加载 -->
  <script src="js/audio.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/go-engine.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
